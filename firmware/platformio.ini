[env:black_f407zg]
platform = ststm32@20.0.0
board = black_f407zg
framework = stm32cube
board_build.ldscript = ldscripts/STM32F407ZGTX_FLASH.ld
platform_packages =
    framework-stm32cubef4@1.28.3
    toolchain-gccarmnoneeabi@1.120301.0
extra_scripts =
    pre:scripts/lwip_build.py
    pre:scripts/tls_build.py

upload_protocol = stlink
debug_tool = stlink

monitor_port = COM5
monitor_speed = 115200

build_flags =
    -DHSE_VALUE=8000000
    -Wl,-u,_printf_float
    -Wl,-Map,$BUILD_DIR/firmware.map
